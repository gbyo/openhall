name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  wayfinder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openhall/web exec playwright install --with-deps chromium
      - run: pnpm test:wayfinder

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: openhall
          POSTGRES_USER: openhall
          POSTGRES_PASSWORD: openhall-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openhall -d openhall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://openhall:openhall-ci@localhost:5432/openhall
      APP_SECRET: ci-only-secret-not-for-production
      TRUST_PROXY: 'false'
      PORT: '3000'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type-aware lint resolves workspace types from dist, so build them
      # first; without this the rules degrade to error-typed noise.
      - run: pnpm exec tsc -b
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm db:types:check
      - run: pnpm openapi:check
      - run: pnpm build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
