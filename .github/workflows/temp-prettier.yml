name: Temporary Prettier formatting

on:
  push:
    branches: [codex/openapi-shared-schemas]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/app.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet -- apps/api/src/app.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/app.test.ts
          git commit -m "Format OpenAPI regression test"
          git push
