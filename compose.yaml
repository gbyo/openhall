name: openhall

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: openhall
      POSTGRES_USER: openhall
      POSTGRES_PASSWORD: openhall-development-only
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - openhall-postgres:/var/lib/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openhall -d openhall']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    command: ['node', 'node_modules/@openhall/db/dist/cli.js']
    environment: &app-environment
      NODE_ENV: ${NODE_ENV:-development}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://openhall:openhall-development-only@postgres:5432/openhall
      APP_SECRET: ${APP_SECRET:-development-only-change-this-secret-32-characters}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-d1891fe393da7c992d51a8f99ec6ee3ea4646b3aa574d3fd1fa37be90725f01d}
      DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:-development-only-key-1}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build: .
    environment: *app-environment
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  openhall-postgres:
